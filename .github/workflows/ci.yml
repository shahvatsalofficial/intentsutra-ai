name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '22'}
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '22'}
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, integration and security tests
        run: npm test
      - name: Host doctor
        run: npm run doctor
      - name: Offline demo
        run: npm run demo
      - name: Audit report (JSON + MD + HTML)
        shell: bash
        run: |
          mkdir ci-ws && cp fixtures/team-invitations.json ci-ws/
          node packages/cli/index.mjs init --workspace ci-ws >/dev/null
          node packages/cli/index.mjs ingest --workspace ci-ws --file team-invitations.json >/dev/null
          node packages/cli/index.mjs audit --workspace ci-ws --out audit-out --quiet --strict
          mv ci-ws/audit-out audit-out
          node packages/cli/index.mjs verify --report audit-out/audit-report.json
      - name: Upload audit report
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-out
          retention-days: 14
  package:
    name: npm pack and clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pack
        run: npm pack --silent
      - name: Install tarball in an empty project and run the CLI through the npm bin shim
        run: |
          mkdir smoke && cd smoke && npm init -y >/dev/null
          npm install ../intentsutra-ai-*.tgz
          npx intentsutra --version
          npx intentsutra doctor >/dev/null
          cp node_modules/intentsutra-ai/fixtures/team-invitations.json .
          npx intentsutra init >/dev/null
          npx intentsutra ingest --file team-invitations.json >/dev/null
          npx intentsutra audit --out out --quiet --strict
          test -f out/audit-report.html && test -f out/audit-report.md && test -f out/audit-report.json
          npx intentsutra verify --report out/audit-report.json
          npx intentsutra install-ide --host claude --target ./proj >/dev/null
          test -f ./proj/intentsutra/skills/intentsutra-prime/SKILL.md
          test -f ./proj/intentsutra/host-adapter/README.md
  secrets-scan:    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed tokens
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|npm_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!tests'; then echo "Possible secret committed"; exit 1; fi
